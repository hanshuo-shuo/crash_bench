[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crashbench"
version = "0.0.1"
description = "CrashBench: controlled causal diagnosis of VLA collision behavior"
requires-python = ">=3.10"
# deps are already provided by the openvla env; keep this light so installing
# crashbench never perturbs the carefully-pinned OpenVLA/LIBERO stack.
dependencies = ["numpy", "imageio"]

[tool.setuptools.packages.find]
include = ["crashbench*"]
