data_contract:
  independent_unit: source_state_sha256
  expected_decisions: 273
  expected_sources: 20
  allowed_splits: [train, calibration, development]
  expected_split_source_counts:
    train: 5
    calibration: 7
    development: 8
  expected_condition_labels: [glass, offpath, noglass]
  condition_family_count: 3
  independent_mechanical_family_label: glass_recovery
  independent_mechanical_family_count: 1
  condition_labels_are_mechanical_families: false

canonical_labels:
  risk: Base outcome is catastrophe
  benefit: max(U_D, U_R) > U_B + epsilon
  epsilon: 0.0
  equality_tolerance: 1.0e-12
  option_order: [base_continue, detour_complete, retreat_hold]
  tie_break: Base then Detour then Retreat
  intervention_advantage: max(U_D, U_R) - U_B
  detour_retreat_advantage: U_D - U_R
  utility:
    task_success: 1.0
    safe_noncompletion: 0.0
    catastrophe: -1.0

policies:
  frozen_phase_2_5b:
    - Base
    - Always Detour
    - Always Retreat
    - Risk->Detour
    - Risk->Retreat
    - Risk->BestFixed
  oracle_benefit_best_fixed_option: detour_complete
  primary_linear_method: ADR-linear-split
  capacity_diagnostic_method: ADR-tiny-nonlinear-choice
  learned_gate_oracle_choice_method: ADR-tiny-nonlinear-choice
  full_learned_adr_method: ADR-tiny-nonlinear-choice

witnesses:
  match_fields: [source, family, horizon, risk]
  require_distinct_strict_options: true
  selection: minimum global-z-scored final robot_state plus nominal_action Euclidean distance per family and unordered option contrast
  tie_break: lexical ordered decision-id pair

story_rule:
  broad:
    disagreement_sources_min: 2
    exact_same_risk_flip_sources_min: 2
    independent_mechanical_families_min: 2
  glass_scoped:
    glass_disagreement_sources_min: 2
    glass_source_profile_option_flip_sources_min: 2
    glass_exact_same_risk_option_flip_sources_min: 1
  exactly_one_next_action:
    BROAD_BENCHMARK_PIVOT: authorize one frozen balanced benchmark collection
    GLASS_SCOPED_BENCHMARK_PIVOT: authorize only a small non-glass option-ambiguity authoring screen
    INSUFFICIENT_FOR_PIVOT: close the current ICLR line and preserve CrashBench as an internal diagnostic artifact

outputs:
  root: results/iclr27
  directory_prefix: risk_value_decoupling
  required:
